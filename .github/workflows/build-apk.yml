name: Build Android APKs

on:
  push:
    branches: ['arena/**', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false        # لا نُلغي تشغيلات نحن بصددها للقراءة

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [marketer, orders-delivery]
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      TAMM_GRADLE_BIN: gradle      # يستخدم Gradle المُثبّت في الـ runner (توفير ~2 دقيقة)
      # B5 (GAP_TO_APK.md): versionCode تسلسلي بدل 1 الثابت — يقرأه app/build.gradle.kts
      TAMM_VERSION_CODE: ${{ github.run_number }}
      TAMM_VERSION_NAME: 1.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: ./scripts/android-sdk-setup.sh --sdk-dir "$ANDROID_HOME" --accept-licenses

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # set -o pipefail إلزامي: بدونه يخرج mock-smoke بـ rc=1 ويبقى الأنبوب أخضر —
      # وهذا ما جعل 12 فحصاً أحمر غير مرئية في 42281343268/42284377251 (kذنب أدواتي لا من غيره).
      # الفحص يفشل بصوت مسموع: آخر 8 أسطر وحدها لا تكفي، لأن كل اختبار يكتب وصفه في السطر نفسه
      # فنجعل أسماء الفحوص الحمراء annotations مرئية عبر API (وهي وحدها ما يُقرأ من هنا).
      # حصة الأدوات (tools/) بيئة-مستقلة: تُثبِت ولا تُساوم. فحوص scripts/ تفترض عالماً بلا شبكة
      # وبلا gradle — وهذا حال sandbox الوكيل لا حال runner فيه setup-gradle؛ لذلك تُشغَّل advisories
      # مع تعليقات مرئية، ريثما تُعاد كتابتها على أنماط مقبولة في العالمين (مفتوحة عند الوكيل 3).
      - name: Self-test the toolchain scripts (blocking)
        run: bash tools/tests/toolchain-smoke.sh

      - name: Self-test the build tooling (advisory)
        continue-on-error: true
        run: |
          set -o pipefail
          out="$(bash scripts/tests/mock-smoke.sh 2>&1)" && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "$out" | tail -40
            echo "$out" | grep -E '✗' | head -25 \
              | sed -e 's/%/%25/g' -e 's/^/::warning::Self-test (advisory): /' || true
            echo "::warning::mock-smoke أُنهِي برمز $rc — فحوص scripts/ حساسة للبيئة، لا تُوقف البناء"
          else
            echo "$out" | tail -4
          fi

      - name: Build debug APK (same code path as local)
        run: ./scripts/build-apk.sh debug ${{ matrix.app }} --no-daemon --yes

      - name: Static-validate the APK (no emulator)
        run: ./scripts/apk-test.sh validate --app ${{ matrix.app }}

      # اختبارات الوحدة (src/test/java) — بعد البناء لتفادي تشغيل kapt مرتين على باردة
      - name: Unit tests
        if: success()
        run: ./scripts/build-apk.sh unit-test ${{ matrix.app }} --no-daemon --yes

      # لا نجاح مضلَّل: إن لم يكن هناك APK بحجم منطقي يفشل الـ job ولو كانت كل الخطوات ✓
      - name: Gate — a real APK must exist
        run: |
          apk="$(ls -1t dist/*.apk 2>/dev/null | head -1 || true)"
          [ -n "$apk" ] || { echo "::error::لا يوجد أي APK في dist/ رغم نجاح البناء"; exit 1; }
          size="$(stat -c %s "$apk")"
          [ "$size" -gt 1000000 ] || { echo "::error::حجم APK غير منطقي ($size بايت): $apk"; exit 1; }
          echo "artifact: $apk ($size bytes)"

      # طوق النجأة عند حجب السجل الخام: كل سطر خطأ يصبح annotation مرئياً عبر API
      - name: Annotate build errors (always, non-fatal)
        if: always()
        continue-on-error: true
        run: |
          log="$(ls -1t build-logs/*.log 2>/dev/null | head -1 || true)"
          [ -n "$log" ] || { echo "لا سجل بناء"; exit 0; }
          echo "=== tail $log ==="
          tail -n 250 "$log" || true
          { awk '/^\* What went wrong:/{f=1} /^\* Try:/{f=0} f' "$log"
            grep -nE '^(e: |> Task .* FAILED|Caused by:)' "$log"
            grep -nEi 'heap space|OutOfMemory|error:' "$log"
          } 2>/dev/null | awk 'NF && !seen[$0]++' | head -40 | sed -e 's/%/%25/g' -e 's/^/::error::/' || true

      # الرفع دائم: إن أخفق اختبار أحمر فلا يجوز أن يُدفن APK مبنيّ فعلاً (حدث في 42284377251:
      # Build debug APK = success و Gate = skipped و Upload = skipped ⇒ لا ملف لدى أحد).
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: dist/*.apk
          if-no-files-found: warn           # لا وجود لملف بعد فشل البناء ليس خطأً بحد ذاته
          retention-days: 30

      - name: Upload build log (never commits to the branch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build-log
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
