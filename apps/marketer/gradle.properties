# TAMMTOOL — إعدادات Gradle للمشروع (كل تطبيق مشروع مستقل)

# A2 (GAP_TO_APK.md): فشل CI 42273932002 كان «D8: java.lang.OutOfMemoryError: Java heap space»
# مع «configured max heap space is '512 MiB'» — أي أن jvmargs لم يكن مضبوطاً إطلاقاً.
# runner العام = 7 GB / 4 نوى ⇒ 4g للـ daemon + 1.5g لـ Kotlin daemon + kapt في عملية منفصلة.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
kapt.use.worker.api=true
kapt.workers.isolation=process

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# كل الاعتماديات AndroidX ⇒ لا حاجة لـ Jetifier (يُبطئ البناء ويستهلك ذاكرة)
android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official
