# TAMMTOOL · أدوات وبناء وتطبيق الفلتر — ملف القفل الوحيد (single source of truth)
# كل بند: [kind:name] ثم مفاتيح. تُقرأ بـ tools/install-toolchain.sh (لا تحرّر سكربتات للتغيير هنا).
#
#   kind = tool        أداة سطر أوامر تُنزَّل وتُشغَّل محلياً
#        = gradle-dep  اعتمادية Gradle/Maven تضاف إلى build.gradle.kts
#        = ci-action   خطوة GitHub Actions
#        = note        قرار/تحذير سياسة (لا يُنزَّل شيء)
#
#   verified = github-api@<date>   ⟵ تحققتُ من الريبو/النسخة/الترخيص عبر api.github.com في هذا التاريخ
#            = repo-fact           ⟵ مأخوذ من ملفات المستودع الحالية (AGP/Kotlin/Compose)
#            = needs-online        ⟵ الإحداثية لم أتحقق منها (maven.google.com محجوب هنا) — افحصها قبل الاعتماد
#
#   ⚠ كل رقم نسخة أدناه موجود فعلاً كـ tag/release في الريبو وقت الكتابة؛ هذا لا يعني أنه
#     أحدث نسخة اليوم، ولا أن الإحداثية منشورة في المستودع الذي تستخدمه.

# ─────────────────────────── سلسلة البناء (build chain) ───────────────────────────
[tool:gradle-wrapper]
kind = tool
repo = gradle/gradle
tag = v8.7.0
asset = n/a
install = scripts
bin = gradlew
license = Apache-2.0
verified = github-api@2026-11-06
purpose = يزرّع gradle-wrapper.jar من tools/vendor/ (لا حاجة لخدمات Gradle) — يغلق A3
notes = ./tools/install-gradle-wrapper.sh --apps
group = build

[tool:jdk17]
kind = tool
repo = adoptium/temurin17-binaries
tag = latest
asset = OpenJDK17U-jdk_{os}_{arch}_hotspot_*.tar.gz
extract = tar
bin = bin/java
license = GPL-2.0-with-classpath-exception
verified = github-api@2026-11-06
purpose = JDK 17 إلزامي لـ AGP 8.x (فرع الوكيل 0 يستخدم 1.9.20/AGP 8.2 لكن البناء نفسه يتطلب 17)
group = build

[tool:android-sdk]
kind = tool
repo = n/a
tag = n/a
asset = commandlinetools-linux-11076708_latest.zip
bin = cmdline-tools/latest/bin/sdkmanager
license = non-OSS (Google, free to use)
verified = repo-fact
purpose = platform-tools + platforms;android-35 + build-tools;35.0.0
notes = موجود أصلاً: ./scripts/android-sdk-setup.sh --sdk-dir DIR --accept-licenses
group = build

# ─────────────────────────── الفحص والتنسيق (quality) ───────────────────────────
[tool:ktlint]
kind = tool
repo = pinterest/ktlint
tag = 1.8.0
asset = ktlint
extract = copy
bin = ktlint
license = MIT
verified = github-api@2026-11-06
purpose = تنسيق/فحص Kotlin — يُصلح آلياً معظم ملاحظات الـ review
usage = ktlint --format "apps/filter/**/*.kt" ; الفحص الصارم: ktlint --relative "apps/**/*.kt"
group = quality

[tool:detekt]
kind = tool
repo = detekt/detekt
tag = v1.23.8
asset = detekt-cli-{ver}-all.jar
extract = jar
bin = detekt-cli
license = Apache-2.0
verified = github-api@2026-11-06
purpose = قواعد تعقيد/روائح في Kotlin بلا إعداد مطلوب
usage = java -jar detekt-cli-all.jar --input apps/filter --report txt
group = quality

[tool:shellcheck]
kind = tool
repo = koalaman/shellcheck
tag = v0.11.0
asset = shellcheck-v{ver}.{os}.{arch2}.tar.xz
extract = tar
bin = bin/shellcheck
license = GPL-3.0
verified = github-api@2026-11-06
purpose = فحص سكربتات tools/ و scripts/ (الأداة التي كان ينقصنا في هذه البيئة)
usage = shellcheck -S warning tools/*.sh scripts/*.sh
group = quality

# ─────────────────────────── فحص الـ APK الناتج (artifacts) ───────────────────────────
[tool:apktool]
kind = tool
repo = iBotPeaches/Apktool
tag = v3.0.3
asset = apktool_{ver}.jar
extract = jar
bin = apktool
license = Apache-2.0
verified = github-api@2026-11-06
purpose = فكّ APK للتحقق من المانيفست/الموارد/الحزمة بعد البناء (بديل لا يحتاج Android SDK)
usage = java -jar apktool.jar d -s app-debug.apk -o out && grep -n "uses-permission" out/AndroidManifest.xml
group = apk-analysis

[tool:jadx]
kind = tool
repo = skylot/jadx
tag = v1.5.6
asset = jadx-{ver}.zip
extract = zip
bin = bin/jadx
license = Apache-2.0
verified = github-api@2026-11-06
purpose = استخراج الكود المصغَّر للتأكد أن R8 لم يمسح ما يجب بقاؤه (وللتحقيق في انهيار)
usage = jadx -d out dist/filter-debug-*.apk && grep -rn "onResume\|RuntimeShader" out/sources | head
group = apk-analysis

[tool:scrcpy]
kind = tool
repo = Genymobile/scrcpy
tag = v5.0.1
asset = scrcpy-{os}-{arch2}-{ver}.tar.gz
extract = tar
bin = bin/scrcpy
license = Apache-2.0
verified = github-api@2026-11-06
purpose = عكس شاشة الهاتف + تسجيل فيديو للجلسة: «تجربة» التطبيق على جهاز حقيقي تُرى وتُقارَن
usage = scrcpy --record filter-demo.mp4 --time-limit 60 ; مع الاختبار: ./scripts/apk-test.sh test --app filter
group = device

