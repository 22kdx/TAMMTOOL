name: Build Marketer APK

on:
  push:
    branches: [ arena/6b69a15d-tammtool ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: arena/6b69a15d-tammtool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

          curl -L --fail --retry 3 --retry-delay 5 \
            -o $HOME/android-sdk/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q -o $HOME/android-sdk/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm -f $HOME/android-sdk/cmdline-tools.zip

          mkdir -p $HOME/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-preview-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/android-sdk-preview-license

          echo "=== Installing Android packages ==="
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "=== Installed packages ==="
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --list-installed || true

      - name: Verify environment
        run: |
          echo "=== Java version ==="
          java -version 2>&1 || true
          echo ""
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          echo ""
          echo "=== SDK directory listing ==="
          ls -la $HOME/android-sdk/ || true
          echo ""
          echo "=== Platform tools ==="
          ls -la $HOME/android-sdk/platform-tools/ 2>/dev/null || echo "No platform-tools"
          echo ""
          echo "=== Build tools ==="
          ls -la $HOME/android-sdk/build-tools/ 2>/dev/null || echo "No build-tools"
          echo ""
          echo "=== Platforms ==="
          ls -la $HOME/android-sdk/platforms/ 2>/dev/null || echo "No platforms"

      - name: Create local.properties
        working-directory: apps/marketer
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          echo "=== local.properties ==="
          cat local.properties

      - name: Make gradlew executable
        working-directory: apps/marketer
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: apps/marketer
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "=== BUILD START $(date) ===" > ci-build.log
          echo "=== Environment ===" >> ci-build.log
          echo "ANDROID_HOME=$ANDROID_HOME" >> ci-build.log
          echo "JAVA_HOME=$JAVA_HOME" >> ci-build.log
          echo "" >> ci-build.log
          echo "=== Running Gradle build ===" >> ci-build.log
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee -a ci-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "" >> ci-build.log
          echo "=== BUILD EXIT CODE: $BUILD_EXIT ===" >> ci-build.log
          echo "" >> ci-build.log
          echo "=== APK files in build directory ===" >> ci-build.log
          find app/build -name "*.apk" -type f 2>/dev/null | tee -a ci-build.log || echo "No APK files found" >> ci-build.log
          echo "" >> ci-build.log
          echo "=== All files in build outputs ===" >> ci-build.log
          find app/build/outputs -type f 2>/dev/null | tee -a ci-build.log || echo "No build outputs found" >> ci-build.log
          
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketer-ci-build-log
          path: apps/marketer/ci-build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Find APK and verify existence
        working-directory: apps/marketer
        run: |
          echo "=== Searching for APK files ==="
          APK_PATH=$(find app/build -name "*.apk" -type f 2>/dev/null | head -1)
          if [[ -n "$APK_PATH" ]]; then
            echo "Found APK: $APK_PATH"
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "APK_FOUND=true" >> $GITHUB_ENV
          else
            echo "ERROR: No APK file found in build directory"
            echo "=== Build outputs directory ==="
            find app/build/outputs -type f 2>/dev/null || echo "No build outputs directory"
            echo "=== Entire build directory ==="
            find app/build -type f 2>/dev/null | head -50 || echo "No build directory"
            echo "APK_FOUND=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketer-app-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error
