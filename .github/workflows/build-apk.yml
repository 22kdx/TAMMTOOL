name: Build Flutter APK

on:
  push:
    branches: [ arena/6b69a15d-tammtool ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: arena/6b69a15d-tammtool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

          curl -L --fail --retry 3 --retry-delay 5 \
            -o $HOME/android-sdk/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q -o $HOME/android-sdk/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm -f $HOME/android-sdk/cmdline-tools.zip

          mkdir -p $HOME/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-preview-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/android-sdk-preview-license

          echo "=== Installing Android packages ==="
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "=== Installed packages ==="
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --list-installed || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Configure Flutter for Android
        run: |
          flutter config --enable-android
          flutter config --android-sdk $HOME/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: |
          echo "y" | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          flutter doctor --android-licenses || true

      - name: Verify environment
        run: |
          echo "=== Java version ==="
          java -version 2>&1 || true
          echo ""
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          echo ""
          echo "=== Flutter version ==="
          flutter --version
          echo ""
          echo "=== Flutter doctor ==="
          flutter doctor -v

      - name: Create local.properties for Flutter Android
        working-directory: apps/flutter-app
        run: |
          echo "flutter.sdk=$(which flutter | sed 's/\/bin\/flutter//')" > android/local.properties
          echo "sdk.dir=$HOME/android-sdk" >> android/local.properties
          echo "=== local.properties ==="
          cat android/local.properties

      - name: Get Flutter dependencies
        working-directory: apps/flutter-app
        run: |
          flutter pub get

      - name: Clean Flutter build
        working-directory: apps/flutter-app
        run: |
          flutter clean

      - name: Build Flutter APK (debug)
        working-directory: apps/flutter-app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "=== BUILD START $(date) ===" > ci-build.log
          echo "=== Environment ===" >> ci-build.log
          echo "ANDROID_HOME=$ANDROID_HOME" >> ci-build.log
          echo "JAVA_HOME=$JAVA_HOME" >> ci-build.log
          echo "" >> ci-build.log
          echo "=== Flutter doctor ===" >> ci-build.log
          flutter doctor -v >> ci-build.log 2>&1
          echo "" >> ci-build.log
          echo "=== Running flutter build apk ===" >> ci-build.log
          flutter build apk --debug --verbose 2>&1 | tee -a ci-build.log
          echo "" >> ci-build.log
          echo "=== APK files in build directory ===" >> ci-build.log
          find build -name "*.apk" -type f 2>/dev/null | tee -a ci-build.log || echo "No APK files found" >> ci-build.log
          echo "BUILD_COMPLETED=true" >> $GITHUB_ENV

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-build-log
          path: apps/flutter-app/ci-build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Find APK and verify existence
        working-directory: apps/flutter-app
        run: |
          echo "=== Searching for APK files ==="
          APK_PATH=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          if [[ -n "$APK_PATH" ]]; then
            echo "Found APK: $APK_PATH"
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "APK_FOUND=true" >> $GITHUB_ENV
          else
            echo "ERROR: No APK file found in build directory"
            echo "=== Build directory contents ==="
            find build -type f 2>/dev/null | head -50 || echo "No files in build directory"
            echo "APK_FOUND=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error
