name: Build Afghani Orders APK

on:
  push:
    branches: [ arena/6b69a15d-tammtool ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: arena/6b69a15d-tammtool

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK (Manual via curl)
        run: |
          # إعداد مسارات Android SDK
          mkdir -p $HOME/android-sdk/cmdline-tools
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV

          # تحميل Android Command Line Tools من خوادم جوجل
          echo "جاري تحميل Android Command Line Tools..."
          curl -L --fail --retry 3 --retry-delay 5 \
            -o $HOME/android-sdk/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          # فك الضغط
          unzip -q -o $HOME/android-sdk/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm -f $HOME/android-sdk/cmdline-tools.zip

          # قبول التراخيص
          mkdir -p $HOME/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/android-sdk/licenses/android-sdk-preview-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk/licenses/android-sdk-preview-license

          # تثبيت الحزم المطلوبة
          echo "جاري تثبيت platform-tools, platform android-35, build-tools 35.0.0..."
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" > /dev/null 2>&1 || true

          # التحقق من التثبيت
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install Gradle
        run: |
          # تحميل توزيع Gradle 8.5
          echo "جاري تحميل Gradle 8.5..."
          curl -L --fail --retry 3 --retry-delay 5 \
            -o $HOME/gradle-8.5-bin.zip \
            https://services.gradle.org/distributions/gradle-8.5-bin.zip

          # فك الضغط
          unzip -q -o $HOME/gradle-8.5-bin.zip -d $HOME/
          rm -f $HOME/gradle-8.5-bin.zip

          # إضافة Gradle إلى PATH
          echo "GRADLE_HOME=$HOME/gradle-8.5" >> $GITHUB_ENV
          echo "PATH=$HOME/gradle-8.5/bin:$PATH" >> $GITHUB_ENV

          # التحقق من التثبيت
          gradle --version

      - name: Create local.properties
        working-directory: apps/marketer
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Verify local.properties
        working-directory: apps/marketer
        run: |
          echo "=== local.properties contents ==="
          cat local.properties
          echo "=== Java version ==="
          java -version 2>&1
          echo "=== Gradle version ==="
          gradle --version

      - name: Configure Gradle project (diagnostic)
        working-directory: apps/marketer
        env:
          ANDROID_HOME: $HOME/android-sdk
          GRADLE_HOME: $HOME/gradle-8.5
        run: gradle :app:help

      - name: Build Debug APK (طلبات الأفغاني) - capture logs
        working-directory: apps/marketer
        env:
          ANDROID_HOME: $HOME/android-sdk
          GRADLE_HOME: $HOME/gradle-8.5
        continue-on-error: true
        run: |
          echo "=== Starting Gradle build ==="
          gradle :app:assembleDebug --stacktrace --info 2>&1 | tee build-output.log
          echo "=== Gradle build exit code: $? ==="

      - name: Print build error as annotation
        if: failure()
        working-directory: apps/marketer
        run: |
          if [[ -f build-output.log ]]; then
            echo "=== LAST 80 LINES OF BUILD LOG ==="
            tail -80 build-output.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: apps/marketer/build-output.log
          retention-days: 30

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: afghani-orders-apk
          path: apps/marketer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30