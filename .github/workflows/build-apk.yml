name: Build Android APK

on:
  push:
    branches: ['arena/**', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # Capture sdkmanager's exit status, not yes's expected SIGPIPE.
          set +o pipefail
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          set -o pipefail
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: apps/marketer
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ci-build.log

      - name: Annotate build errors
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          log = Path("apps/marketer/ci-build.log")
          if log.exists():
              lines = [line for line in log.read_text(errors="replace").splitlines() if line.startswith("e:") or "error:" in line or "What went wrong" in line or line.startswith("> ")]
              for line in lines[:100]:
                  print("::error::" + line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PYTHON

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketer-ci-build-log
          path: apps/marketer/ci-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketer-debug-apk
          path: apps/marketer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
