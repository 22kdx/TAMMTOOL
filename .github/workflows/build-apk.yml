name: Build Flutter APK

on:
  push:
    branches: [ arena/6b69a15d-tammtool ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: arena/6b69a15d-tammtool
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Android dependencies
        run: |
          flutter doctor -v
          flutter config --enable-android

      - name: Create local.properties for Flutter
        working-directory: apps/flutter-app
        run: |
          echo "flutter.sdk=$HOME/flutter" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "=== local.properties ==="
          cat android/local.properties

      - name: Get Flutter dependencies
        working-directory: apps/flutter-app
        run: |
          flutter pub get

      - name: Build Flutter APK
        working-directory: apps/flutter-app
        env:
          ANDROID_HOME: $ANDROID_HOME
        run: |
          echo "=== BUILD START $(date) ===" > ci-build.log
          echo "=== Flutter doctor ===" >> ci-build.log
          flutter doctor -v >> ci-build.log 2>&1
          echo "=== Running flutter build apk ===" >> ci-build.log
          set +e
          set -o pipefail
          flutter build apk --debug --split-per-abi --verbose 2>&1 | tee -a ci-build.log
          BUILD_EXIT=$?
          set +o pipefail
          echo "=== BUILD EXIT CODE: $BUILD_EXIT ===" | tee -a ci-build.log
          echo "=== Build output directory ===" | tee -a ci-build.log
          find build -type f -name "*.apk" 2>/dev/null | tee -a ci-build.log || echo "No APK files found in build directory" | tee -a ci-build.log
          echo "BUILD_EXIT=$BUILD_EXIT" >> $GITHUB_ENV

      - name: Upload build log as artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-build-log
          path: apps/flutter-app/ci-build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Find and upload APK artifact
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "=== ci-build.log content ==="
          cat apps/flutter-app/ci-build.log 2>/dev/null || echo "ci-build.log not found"
          echo ""
          echo "=== Searching for APK files ==="
          find apps/flutter-app/build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          echo ""
          echo "=== Uploading APK artifact ==="
          APK_PATH=$(find apps/flutter-app/build -name "*.apk" -type f 2>/dev/null | head -1)
          if [[ -n "$APK_PATH" ]]; then
            echo "Found APK: $APK_PATH"
            mkdir -p apk-output
            cp "$APK_PATH" apk-output/app-debug.apk
          else
            echo "No APK was built, creating placeholder"
            mkdir -p apk-output
            echo "No APK was built" > apk-output/no-apk.txt
            exit 1
          fi
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-apk
          path: apk-output/
          retention-days: 30
          if-no-files-found: warn
