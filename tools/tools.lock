# ─────────────── فلاتر بديلة جاهزة (استُبعدت — والسبب موثّق) ───────────────
[note:gpuimage]
kind = note
license = غير محدد في الريبو (upstream BSD) — تحقق قبل الشحن
verified = github-api@2026-11-06
purpose = wasabeef/android-gpuimage (9153★) و wysaid/android-gpuimage-plus (MIT، نشط 2026-07)
notes = **لم نُضِفها**: NDK/native .so + تراخيص غير محسومة + آخر دفعة 2022 للأشهر. AGSL في Android
  نفسه (API 33+) يعطي نفس الفلاتر بلا اعتماديات ولا ملفات ثنائية ⇒ الانحياز للـ platform.

[note:magiccamera]
kind = note
license = غير محدد
verified = github-api@2026-11-06
purpose = wuhaoyu1990/MagicCamera (5514★) — كاميرا+fلاتر GLSL كاملة
notes = متوقفة منذ 2020 وبلا ترخيص ⇒ مرجع تعليمي لقراءة الكود، لا اعتمادية في البناء.

[note:ffmpeg-kit]
kind = note
license = LGPL-3.0 (ومشروط بتراخيص codecs)
verified = github-api@2026-11-06
purpose = arthenica/ffmpeg-kit — فلاتر فيديو/صوت
notes = **archived = true** (آخر دفعة 2026-07-02): لا تعتمده في مشروع جديد. إن لزم الفيديو:
  fork مجتمع (microg/ffmpeg-kit) أو Media3 Transformer (Apache-2.0، رسمي، يدعم effects).

[note:mlkit-segmentation]
kind = note
license = غير مفتوح المصدر (Google Play Services)
verified = needs-online
purpose = عزل الشخص عن الخلفية (فلاتر الواقع المعزّز)
notes = مفتوحة المصدر ≠ شرط، لكن نموذجها يُنزَّل ديناميكياً ⇒ لا يعمل بلا Play Services؛ إن أردته
  فاجعله ميزة اختيارية (feature toggle) لا مساراً أساسياً في التطبيق.

